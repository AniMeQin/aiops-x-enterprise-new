[project]
name = "aiops-x-enterprise"
version = "0.1.0"
description = "AIOps-X Enterprise control-plane Python services"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16.4,<2",
  "asyncpg>=0.30.0,<1",
  "greenlet>=3.2.4,<4",
  "minio>=7.2.16,<8",
  "celery>=5.5.3,<6",
  "cryptography>=45.0.5,<47",
  "fastapi>=0.116.1,<1",
  "nats-py>=2.11.0,<3",
  "opentelemetry-api>=1.36.0,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.36.0,<2",
  "opentelemetry-instrumentation-celery>=0.57b0,<1",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-instrumentation-redis>=0.57b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1",
  "opentelemetry-sdk>=1.36.0,<2",
  "pgvector>=0.4.1,<1",
  "prometheus-client>=0.22.1,<1",
  "pydantic-settings>=2.10.1,<3",
  "redis>=6.2.0,<7",
  "sqlalchemy>=2.0.41,<3",
  "structlog>=25.4.0,<26",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0,<1",
  "httpx>=0.28.1,<1",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.7,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = [
  "apps/api/src",
  "apps/worker/src",
  "apps/ai-engine/src",
  "packages/plugin-sdk-python/src",
]
testpaths = ["apps/api/tests", "apps/ai-engine/tests", "tests"]

[tool.coverage.run]
source = ["aiops_x_api.modules"]
omit = [
  "*/api.py",
  "*/infrastructure/models.py",
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
  "apps/api/src",
  "apps/worker/src",
  "apps/ai-engine/src",
  "packages/plugin-sdk-python/src",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "prometheus_client.*"]
ignore_missing_imports = true
