server {
  listen 8443 ssl;
  server_name _;

  ssl_certificate /etc/aiops-x-pki/agent-server-cert.pem;
  ssl_certificate_key /etc/aiops-x-pki/agent-server-key.pem;
  ssl_client_certificate /etc/aiops-x-pki/agent-ca-cert.pem;
  ssl_verify_client optional;
  ssl_verify_depth 2;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  client_max_body_size 128k;

  location = /api/v1/agents/enroll {
    if ($ssl_client_verify = SUCCESS) { return 403; }
    proxy_pass http://api:8000/api/v1/agents/enroll;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/v1/agents/ {
    if ($ssl_client_verify != SUCCESS) { return 496; }
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
    proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
  }
}
