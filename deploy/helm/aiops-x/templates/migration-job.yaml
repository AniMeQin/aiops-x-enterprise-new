apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aiops-x.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "aiops-x.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata: {labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: migration}}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "aiops-x.fullname" . }}-api
      automountServiceAccountToken: false
      securityContext: {{- include "aiops-x.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migration
          image: {{ include "aiops-x.image" (list .Values.images.python .) }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: {{ include "aiops-x.fullname" . }}-config}
            - secretRef: {name: {{ .Values.existingSecrets.api }}}
          securityContext: {{- include "aiops-x.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
