apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-x.fullname" . }}-api
  labels:
    {{- include "aiops-x.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-x.fullname" . }}-ai-engine
  labels:
    {{- include "aiops-x.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ai-engine}
  ports: [{name: http, port: 8001, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-x.fullname" . }}-worker-metrics
  labels:
    {{- include "aiops-x.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker}
  ports: [{name: metrics, port: 8002, targetPort: metrics}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-x.fullname" . }}-web
  labels:
    {{- include "aiops-x.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aiops-x.fullname" . }}
  annotations: {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "aiops-x.fullname" . }}-web, port: {name: http}}
{{- end }}
{{- if .Values.agentGateway.enabled }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "aiops-x.fullname" . }}-agent-gateway}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: agent-gateway}
  ports: [{name: mtls, port: 8443, targetPort: mtls}]
---
# A TCP-capable load balancer must pass TLS through to this Service so Nginx can
# validate the Agent client certificate. Do not terminate Agent TLS at Web Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-x.fullname" . }}-agent-public
  annotations: {aiops-x.io/required-dns-name: {{ .Values.agentGateway.host | quote }}}
spec:
  type: LoadBalancer
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: agent-gateway}
  ports: [{name: mtls, port: 443, targetPort: mtls}]
{{- end }}
