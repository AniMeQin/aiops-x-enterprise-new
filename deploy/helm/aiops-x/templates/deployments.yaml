{{- $root := . -}}
{{- range $name, $component := dict "api" "api" "worker" "worker" "ai-engine" "aiEngine" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops-x.fullname" $root }}-{{ $name }}
  labels:
    {{- include "aiops-x.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ index $root.Values.replicaCount $component }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "aiops-x.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ ternary "8002" (ternary "8000" "8001" (eq $name "api")) (eq $name "worker") | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "aiops-x.fullname" $root }}-{{ $name }}
      automountServiceAccountToken: false
      securityContext: {{- include "aiops-x.podSecurityContext" $root | nindent 8 }}
      imagePullSecrets: {{ toYaml $root.Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "aiops-x.image" (list $root.Values.images.python $root) }}
          imagePullPolicy: {{ $root.Values.images.python.pullPolicy }}
          {{- if eq $name "api" }}
          command: ["uvicorn", "aiops_x_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{name: http, containerPort: 8000}]
          {{- else if eq $name "worker" }}
          command: ["celery", "-A", "aiops_x_worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
          ports: [{name: metrics, containerPort: 8002}]
          {{- else }}
          command: ["uvicorn", "aiops_x_ai.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports: [{name: http, containerPort: 8001}]
          {{- end }}
          envFrom:
            - configMapRef: {name: {{ include "aiops-x.fullname" $root }}-config}
            - secretRef: {name: {{ index $root.Values.existingSecrets $component }}}
          env:
            {{- if eq $name "worker" }}
            - {name: AIOPS_WORKER_MONITOR_PORT, value: "8002"}
            - name: AIOPS_MINIO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecrets.worker }}, key: MINIO_WORKER_USER}}
            - name: AIOPS_MINIO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecrets.worker }}, key: MINIO_WORKER_PASSWORD}}
            {{- end }}
            - {name: TMPDIR, value: /tmp}
          securityContext: {{- include "aiops-x.containerSecurityContext" $root | nindent 12 }}
          resources: {{ toYaml (index $root.Values.resources $component) | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if eq $name "api" }}
            - {name: vault-token, mountPath: /run/secrets/vault-token, subPath: vault-token, readOnly: true}
            - {name: agent-pki, mountPath: /run/secrets/agent-ca-key.pem, subPath: agent-ca-key.pem, readOnly: true}
            - {name: agent-pki, mountPath: /run/secrets/agent-ca-cert.pem, subPath: agent-ca-cert.pem, readOnly: true}
            - {name: agent-pki, mountPath: /run/secrets/agent-server-cert.pem, subPath: agent-server-cert.pem, readOnly: true}
            - {name: agent-pki, mountPath: /run/secrets/agent-server-key.pem, subPath: agent-server-key.pem, readOnly: true}
            - {name: agent-pki, mountPath: /run/secrets/agent-task-signing-key.pem, subPath: agent-task-signing-key.pem, readOnly: true}
            - {name: agent-pki, mountPath: /run/secrets/agent-task-signing-cert.pem, subPath: agent-task-signing-cert.pem, readOnly: true}
            {{- end }}
          {{- if eq $name "api" }}
          startupProbe: {httpGet: {path: /ready, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20}
          {{- else if eq $name "worker" }}
          readinessProbe: {httpGet: {path: /ready, port: metrics}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: metrics}, periodSeconds: 20}
          {{- else }}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        {{- if eq $name "api" }}
        - name: vault-token
          secret: {secretName: {{ $root.Values.existingSecrets.vault }}, items: [{key: vault-token, path: vault-token}]}
        - name: agent-pki
          secret: {secretName: {{ $root.Values.existingSecrets.agentPki }}}
        {{- end }}
      nodeSelector: {{ toYaml $root.Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml $root.Values.tolerations | nindent 8 }}
      affinity: {{ toYaml $root.Values.affinity | nindent 8 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops-x.fullname" . }}-beat
  labels:
    {{- include "aiops-x.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: beat}
  template:
    metadata:
      labels:
        {{- include "aiops-x.labels" . | nindent 8 }}
        app.kubernetes.io/component: beat
    spec:
      serviceAccountName: {{ include "aiops-x.fullname" . }}-worker
      automountServiceAccountToken: false
      securityContext: {{- include "aiops-x.podSecurityContext" . | nindent 8 }}
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: beat
          image: {{ include "aiops-x.image" (list .Values.images.python .) }}
          imagePullPolicy: {{ .Values.images.python.pullPolicy }}
          command: ["celery", "-A", "aiops_x_worker.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
          envFrom:
            - configMapRef: {name: {{ include "aiops-x.fullname" . }}-config}
            - secretRef: {name: {{ .Values.existingSecrets.worker }}}
          env:
            - name: AIOPS_MINIO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecrets.worker }}, key: MINIO_WORKER_USER}}
            - name: AIOPS_MINIO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecrets.worker }}, key: MINIO_WORKER_PASSWORD}}
            - {name: TMPDIR, value: /tmp}
          securityContext: {{- include "aiops-x.containerSecurityContext" . | nindent 12 }}
          resources: {{ toYaml .Values.resources.beat | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 128Mi}}]
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops-x.fullname" . }}-web
  labels: {{- include "aiops-x.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  template:
    metadata:
      labels:
        {{- include "aiops-x.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "aiops-x.fullname" . }}-web
      automountServiceAccountToken: false
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: {{ include "aiops-x.image" (list .Values.images.web .) }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          securityContext: {{- include "aiops-x.nginxSecurityContext" . | nindent 12 }}
          resources: {{ toYaml .Values.resources.web | nindent 12 }}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 20}
          volumeMounts:
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: web.conf, readOnly: true}
      volumes:
        - {name: nginx-cache, emptyDir: {}}
        - {name: nginx-run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - {name: nginx-config, configMap: {name: {{ include "aiops-x.fullname" . }}-nginx}}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
{{- if .Values.agentGateway.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops-x.fullname" . }}-agent-gateway
  labels: {{- include "aiops-x.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.agentGateway }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: agent-gateway}
  template:
    metadata:
      labels:
        {{- include "aiops-x.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent-gateway
    spec:
      serviceAccountName: {{ include "aiops-x.fullname" . }}-web
      automountServiceAccountToken: false
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: {{ include "aiops-x.image" (list .Values.images.gateway .) }}
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          ports: [{name: mtls, containerPort: 8443}]
          securityContext: {{- include "aiops-x.nginxSecurityContext" . | nindent 12 }}
          resources: {{ toYaml .Values.resources.agentGateway | nindent 12 }}
          readinessProbe: {tcpSocket: {port: mtls}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: mtls}, periodSeconds: 20}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: agent-gateway.conf, readOnly: true}
            - {name: server-tls, mountPath: /etc/aiops-x/server, readOnly: true}
            - {name: client-ca, mountPath: /etc/aiops-x/client-ca, readOnly: true}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: {{ include "aiops-x.fullname" . }}-nginx}}
        - {name: server-tls, secret: {secretName: {{ .Values.agentGateway.tlsSecretName }}}}
        - {name: client-ca, secret: {secretName: {{ .Values.agentGateway.clientCaSecretName }}}}
        - {name: nginx-cache, emptyDir: {}}
        - {name: nginx-run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
{{- end }}
