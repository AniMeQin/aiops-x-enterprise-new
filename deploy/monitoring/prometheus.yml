global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: authorized-test

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/dynamic-rules/*.json

scrape_configs:
  - job_name: aiops-x-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node/*.json"]
        refresh_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          aiops_tenant_slug: development
          aiops_project_slug: local-compose
          aiops_asset_id: LOCAL-COMPOSE-HOST

  - job_name: aiops-x-ai-engine
    static_configs:
      - targets: ["ai-engine:8001"]

  - job_name: aiops-x-worker
    static_configs:
      - targets: ["worker:8002"]

  - job_name: aiops-x-edge-agent
    static_configs:
      - targets: ["edge-agent:9188"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
