name: ${COMPOSE_PROJECT_NAME:-aiops-x-enterprise}

services:
  postgres:
    build:
      context: .
      dockerfile: deploy/compose/postgres-pgvector.Dockerfile
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-postgres:16.4-bookworm}
        PGVECTOR_BUILDER_IMAGE: ${PGVECTOR_BUILDER_IMAGE:-gcc:13.3.0-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    networks: [control-plane]

  redis:
    image: ${REDIS_IMAGE:-redis:7.2.5-alpine}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
    networks: [control-plane]

  nats:
    image: ${NATS_IMAGE:-nats:2.10.17-alpine}
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
    networks: [control-plane]

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-06-29T01-20-47Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$${status}" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    networks: [control-plane]

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2024-06-29T19-08-46Z}
    entrypoint: [/bin/sh, /opt/aiops-x/minio-init.sh]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_USER: ${MINIO_API_USER}
      MINIO_API_PASSWORD: ${MINIO_API_PASSWORD}
      MINIO_WORKER_USER: ${MINIO_WORKER_USER}
      MINIO_WORKER_PASSWORD: ${MINIO_WORKER_PASSWORD}
      AIOPS_REPORT_BUCKET: ${AIOPS_REPORT_BUCKET:-aiops-reports}
      AIOPS_AUDIT_ARCHIVE_BUCKET: ${AIOPS_AUDIT_ARCHIVE_BUCKET:-aiops-audit-worm}
      AIOPS_AUDIT_RETENTION_DAYS: ${AIOPS_AUDIT_RETENTION_DAYS:-2555}
    volumes:
      - ./deploy/compose/minio-init.sh:/opt/aiops-x/minio-init.sh:ro
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"
    networks: [control-plane]

  vault:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.17.2}
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_LOCAL_CONFIG: >-
        {"storage":{"file":{"path":"/vault/file"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":1}},"ui":true,"disable_mlock":true}
    command: ["server"]
    volumes:
      - vault-data:/vault/file
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    networks: [control-plane]

  api:
    build:
      context: .
      dockerfile: deploy/compose/python.Dockerfile
      target: python-runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.4-slim}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn aiops_x_api.main:app --host 0.0.0.0 --port 8000
    environment:
      AIOPS_ENVIRONMENT: ${AIOPS_ENVIRONMENT:-development}
      AIOPS_LOG_LEVEL: ${AIOPS_LOG_LEVEL:-INFO}
      AIOPS_DATABASE_URL: ${AIOPS_DATABASE_URL}
      AIOPS_REDIS_URL: ${AIOPS_REDIS_URL}
      AIOPS_NATS_URL: ${AIOPS_NATS_URL}
      AIOPS_MINIO_ENDPOINT: ${AIOPS_MINIO_ENDPOINT}
      AIOPS_MINIO_SECURE: ${AIOPS_MINIO_SECURE:-false}
      AIOPS_MINIO_ACCESS_KEY: ${AIOPS_MINIO_ACCESS_KEY}
      AIOPS_MINIO_SECRET_KEY: ${AIOPS_MINIO_SECRET_KEY}
      AIOPS_REPORT_BUCKET: ${AIOPS_REPORT_BUCKET:-aiops-reports}
      AIOPS_AUDIT_ARCHIVE_BUCKET: ${AIOPS_AUDIT_ARCHIVE_BUCKET:-aiops-audit-worm}
      AIOPS_AUDIT_RETENTION_DAYS: ${AIOPS_AUDIT_RETENTION_DAYS:-2555}
      AIOPS_SECRET_PROVIDER: ${AIOPS_SECRET_PROVIDER:-vault}
      AIOPS_VAULT_ADDR: http://vault:8200
      AIOPS_VAULT_TOKEN_FILE: /run/vault/vault-token
      AIOPS_VAULT_KV_MOUNT: ${AIOPS_VAULT_KV_MOUNT:-kv}
      AIOPS_OUTBOUND_ALLOWED_HOSTS: ${AIOPS_OUTBOUND_ALLOWED_HOSTS:-[]}
      AIOPS_CORS_ORIGINS: ${AIOPS_CORS_ORIGINS}
      AIOPS_JWT_SECRET: ${AIOPS_JWT_SECRET}
      AIOPS_BOOTSTRAP_TOKEN: ${AIOPS_BOOTSTRAP_TOKEN}
      AIOPS_ACCESS_TOKEN_TTL_SECONDS: ${AIOPS_ACCESS_TOKEN_TTL_SECONDS:-900}
      AIOPS_REFRESH_TOKEN_TTL_SECONDS: ${AIOPS_REFRESH_TOKEN_TTL_SECONDS:-604800}
      AIOPS_LOGIN_MAX_FAILURES: ${AIOPS_LOGIN_MAX_FAILURES:-5}
      AIOPS_LOGIN_LOCK_SECONDS: ${AIOPS_LOGIN_LOCK_SECONDS:-900}
      AIOPS_OIDC_ENABLED: ${AIOPS_OIDC_ENABLED:-false}
      AIOPS_OIDC_ISSUER_URL: ${AIOPS_OIDC_ISSUER_URL:-}
      AIOPS_OIDC_CLIENT_ID: ${AIOPS_OIDC_CLIENT_ID:-}
      AIOPS_OIDC_CLIENT_SECRET: ${AIOPS_OIDC_CLIENT_SECRET:-}
      AIOPS_OIDC_REDIRECT_URI: ${AIOPS_OIDC_REDIRECT_URI:-http://localhost:8080/api/v1/auth/oidc/callback}
      AIOPS_OIDC_SCOPES: ${AIOPS_OIDC_SCOPES:-openid profile email}
      AIOPS_OIDC_AUTO_PROVISION: ${AIOPS_OIDC_AUTO_PROVISION:-false}
      AIOPS_OIDC_DEFAULT_ROLE_NAMES: ${AIOPS_OIDC_DEFAULT_ROLE_NAMES:-[]}
      AIOPS_ABAC_ENFORCED: ${AIOPS_ABAC_ENFORCED:-false}
      AIOPS_AUTH_RATE_LIMIT_PER_MINUTE: ${AIOPS_AUTH_RATE_LIMIT_PER_MINUTE:-30}
      AIOPS_API_RATE_LIMIT_PER_MINUTE: ${AIOPS_API_RATE_LIMIT_PER_MINUTE:-600}
      AIOPS_AGENT_CA_KEY_PATH: /run/secrets/agent-ca-key.pem
      AIOPS_AGENT_CA_CERTIFICATE_PATH: /run/secrets/agent-ca-cert.pem
      AIOPS_AGENT_SERVER_CERTIFICATE_PATH: /run/secrets/agent-server-cert.pem
      AIOPS_AGENT_SERVER_KEY_PATH: /run/secrets/agent-server-key.pem
      AIOPS_AGENT_TASK_SIGNING_KEY_PATH: /run/secrets/agent-task-signing-key.pem
      AIOPS_AGENT_TASK_SIGNING_CERTIFICATE_PATH: /run/secrets/agent-task-signing-cert.pem
      AIOPS_AGENT_CERTIFICATE_TTL_HOURS: ${AIOPS_AGENT_CERTIFICATE_TTL_HOURS:-24}
      AIOPS_AGENT_CERTIFICATE_RENEWAL_WINDOW_HOURS: ${AIOPS_AGENT_CERTIFICATE_RENEWAL_WINDOW_HOURS:-8}
      AIOPS_ALERTMANAGER_WEBHOOK_TOKEN: ${AIOPS_ALERTMANAGER_WEBHOOK_TOKEN}
      AIOPS_PROMETHEUS_URL: http://prometheus:9090
      AIOPS_LOKI_URL: http://loki:3100
      AIOPS_TEMPO_URL: http://tempo:3200
      AIOPS_ALERT_CORRELATION_WINDOW_SECONDS: ${AIOPS_ALERT_CORRELATION_WINDOW_SECONDS:-900}
      AIOPS_MONITORING_SAMPLE_MAX_AGE_SECONDS: ${AIOPS_MONITORING_SAMPLE_MAX_AGE_SECONDS:-90}
      AIOPS_AI_PROVIDER: ${AIOPS_AI_PROVIDER:-}
      AIOPS_AI_ENGINE_URL: http://ai-engine:8001
      AIOPS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AIOPS_OTEL_SERVICE_NAME: aiops-x-api
    volumes:
      - ${AIOPS_PKI_DIR:-./deploy/pki}:/run/secrets:ro
      - ${AIOPS_VAULT_TOKEN_HOST_FILE:-./deploy/vault/vault-token.example}:/run/vault/vault-token:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      vault: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m
    networks: [control-plane]

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-quay.io/prometheus/node-exporter:v1.8.1}
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9100/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 128m
    networks: [control-plane]

  alertmanager-init:
    image: ${ALERTMANAGER_IMAGE:-quay.io/prometheus/alertmanager:v0.27.0}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        cp /source/alertmanager-webhook-token /target/alertmanager-webhook-token
        && chown 65534:65534 /target/alertmanager-webhook-token
        && chmod 0400 /target/alertmanager-webhook-token
    volumes:
      - ${AIOPS_ALERTMANAGER_TOKEN_FILE:-./deploy/monitoring/alertmanager-webhook-token.example}:/source/alertmanager-webhook-token:ro
      - alertmanager-secrets:/target
    restart: "no"
    mem_limit: 32m
    networks: [control-plane]

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-quay.io/prometheus/alertmanager:v0.27.0}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-secrets:/run/secrets:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      api: {condition: service_healthy}
      alertmanager-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "test -r /run/secrets/alertmanager-webhook-token && wget -q -O - http://127.0.0.1:9093/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 128m
    networks: [control-plane]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-quay.io/prometheus/prometheus:v2.53.1}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      node-exporter: {condition: service_healthy}
      alertmanager: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m
    networks: [control-plane]

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.1.0}
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    mem_limit: 256m
    networks: [control-plane]

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:2.5.0}
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    mem_limit: 256m
    networks: [control-plane]

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.105.0}
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "127.0.0.1:13133:13133"
    depends_on:
      loki: {condition: service_started}
      tempo: {condition: service_started}
    restart: unless-stopped
    mem_limit: 256m
    networks: [control-plane]

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.1.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus: {condition: service_healthy}
      loki: {condition: service_started}
      tempo: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 256m
    networks: [control-plane]

  worker:
    build:
      context: .
      dockerfile: deploy/compose/python.Dockerfile
      target: python-runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.4-slim}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    command:
      - celery
      - -A
      - aiops_x_worker.celery_app:celery_app
      - worker
      - --beat
      - --schedule=/tmp/celerybeat-schedule
      - --loglevel=INFO
      - --concurrency=${AIOPS_WORKER_CONCURRENCY:-2}
    environment:
      AIOPS_DATABASE_URL: ${AIOPS_DATABASE_URL}
      AIOPS_REDIS_URL: ${AIOPS_REDIS_URL}
      AIOPS_NATS_URL: ${AIOPS_NATS_URL}
      AIOPS_MINIO_ENDPOINT: ${AIOPS_MINIO_ENDPOINT}
      AIOPS_MINIO_SECURE: ${AIOPS_MINIO_SECURE:-false}
      AIOPS_MINIO_ACCESS_KEY: ${MINIO_WORKER_USER}
      AIOPS_MINIO_SECRET_KEY: ${MINIO_WORKER_PASSWORD}
      AIOPS_AUDIT_ARCHIVE_BUCKET: ${AIOPS_AUDIT_ARCHIVE_BUCKET:-aiops-audit-worm}
      AIOPS_AUDIT_RETENTION_DAYS: ${AIOPS_AUDIT_RETENTION_DAYS:-2555}
      AIOPS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AIOPS_OTEL_SERVICE_NAME: aiops-x-worker
      AIOPS_WORKER_MONITOR_PORT: "8002"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      nats: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m
    networks: [control-plane]

  ai-engine:
    build:
      context: .
      dockerfile: deploy/compose/python.Dockerfile
      target: python-runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.4-slim}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    command: ["uvicorn", "aiops_x_ai.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      AIOPS_ENVIRONMENT: ${AIOPS_ENVIRONMENT:-development}
      AIOPS_OUTBOUND_ALLOWED_HOSTS: ${AIOPS_OUTBOUND_ALLOWED_HOSTS:-[]}
      AIOPS_AI_PROVIDER: ${AIOPS_AI_PROVIDER:-}
      AIOPS_AI_API_KEY: ${AIOPS_AI_API_KEY:-}
      AIOPS_AI_BASE_URL: ${AIOPS_AI_BASE_URL:-https://api.openai.com/v1}
      AIOPS_AI_MODEL: ${AIOPS_AI_MODEL:-gpt-4.1-mini}
      AIOPS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AIOPS_OTEL_SERVICE_NAME: aiops-x-ai-engine
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 256m
    networks: [control-plane]

  web:
    build:
      context: .
      dockerfile: deploy/compose/web.Dockerfile
      target: web-runtime
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.22.0-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27.0-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "${AIOPS_WEB_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 128m
    networks: [control-plane]

  agent-gateway:
    image: ${NGINX_IMAGE:-nginx:1.27.0-alpine}
    volumes:
      - ./deploy/compose/agent-api-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${AIOPS_PKI_DIR:-./deploy/pki}:/etc/aiops-x-pki:ro
    ports:
      - "${AIOPS_AGENT_BIND:-127.0.0.1}:8443:8443"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -S -O /dev/null https://127.0.0.1:8443/api/v1/agents/enroll 2>&1 | grep -q '405 Method Not Allowed'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 64m
    networks: [control-plane]

  edge-agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: deploy/compose/agent.Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.24.6-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.20.2}
    environment:
      AIOPS_CONTROL_PLANE_URL: ${AIOPS_AGENT_CONTROL_PLANE_URL:-https://agent-gateway:8443}
      AIOPS_REGISTRATION_TOKEN: ${AIOPS_REGISTRATION_TOKEN:-}
      AIOPS_STATE_DIRECTORY: /var/lib/aiops-x
      AIOPS_CA_CERT_PATH: /etc/aiops-x/agent-ca-cert.pem
      # Only the internal Compose network can reach this address; no host port is published.
      AIOPS_AGENT_LISTEN: 0.0.0.0:9188
      AIOPS_HEARTBEAT_INTERVAL: ${AIOPS_HEARTBEAT_INTERVAL:-15s}
      AIOPS_TASK_POLL_INTERVAL: ${AIOPS_TASK_POLL_INTERVAL:-5s}
      AIOPS_CERTIFICATE_RENEW_BEFORE: ${AIOPS_CERTIFICATE_RENEW_BEFORE:-6h}
    volumes:
      - agent-data:/var/lib/aiops-x
      - ${AIOPS_PKI_DIR:-./deploy/pki}/agent-ca-cert.pem:/etc/aiops-x/agent-ca-cert.pem:ro
    depends_on:
      agent-gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9188/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 64m
    networks: [control-plane]

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  vault-data:
  agent-data:
  prometheus-data:
  alertmanager-data:
  alertmanager-secrets:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  control-plane:
    driver: bridge
