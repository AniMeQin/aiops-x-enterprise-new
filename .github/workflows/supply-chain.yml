name: signed-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  build-sign-attest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: python
            dockerfile: deploy/compose/python.Dockerfile
            target: python-runtime
          - component: web
            dockerfile: deploy/compose/web.Dockerfile
            target: web-runtime
          - component: edge-agent
            dockerfile: deploy/compose/agent.Dockerfile
            target: ""
          - component: backup
            dockerfile: deploy/compose/backup.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/aiops-x-${{ matrix.component }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3.9.2
      - name: Sign immutable digest with GitHub OIDC
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/aiops-x-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Create CycloneDX SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/aiops-x-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.component }}.cdx.json
      - name: Scan digest and fail on high/critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/aiops-x-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Attest SBOM to immutable digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/aiops-x-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.component }}.cdx.json" "$IMAGE@$DIGEST"
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-${{ matrix.component }}
          path: |
            sbom-${{ matrix.component }}.cdx.json
            trivy-${{ matrix.component }}.sarif
          if-no-files-found: error
